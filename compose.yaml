services:
  veda-mail:
    image: ${VEDA_MAIL_IMAGE:-ghcr.io/bestmaa/veda-mail:latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      VEDA_MAIL_SETUP_TOKEN: ${VEDA_MAIL_SETUP_TOKEN:?Set a setup token of at least 24 characters}
      VEDA_MAIL_ADMIN_RECOVERY_TOKEN: ${VEDA_MAIL_ADMIN_RECOVERY_TOKEN:-}
      VEDA_MAIL_ALLOWED_PROVIDER_HOSTS: ${VEDA_MAIL_ALLOWED_PROVIDER_HOSTS:?Set the permitted mail-provider hostname}
      VEDA_MAIL_STALWART_MANAGEMENT_API_KEY: ${VEDA_MAIL_STALWART_MANAGEMENT_API_KEY:-}
      VEDA_MAIL_STALWART_MANAGEMENT_ORIGIN: ${VEDA_MAIL_STALWART_MANAGEMENT_ORIGIN:-}
      VEDA_MAIL_TRUST_PROXY_HEADERS: ${VEDA_MAIL_TRUST_PROXY_HEADERS:-false}
      VEDA_MAIL_PUBLIC_URL: ${VEDA_MAIL_PUBLIC_URL:-http://localhost:3000}
      VEDA_MAIL_DATA_DIR: /data
      VEDA_MAIL_CLAMAV_HOST: ${VEDA_MAIL_CLAMAV_HOST:-clamav}
      VEDA_MAIL_CLAMAV_PORT: ${VEDA_MAIL_CLAMAV_PORT:-3310}
    ports:
      - "${VEDA_MAIL_BIND_ADDRESS:-127.0.0.1}:${VEDA_MAIL_PORT:-3000}:3000"
    expose:
      - "3000"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 20s
    volumes:
      - veda-mail-data:/data

  clamav:
    image: clamav/clamav:1.5.3@sha256:7f5389ccaa2368c383fa80e167ccfe44348d71e685f926fce4755eed1757673a
    cpus: ${VEDA_MAIL_CLAMAV_CPU_LIMIT:-2.0}
    expose:
      - "3310"
    healthcheck:
      test:
        - CMD-SHELL
        - printf 'PING\n' | nc 127.0.0.1 3310 | grep -qx PONG
      interval: 30s
      timeout: 5s
      start_period: 6m
      retries: 3
    init: true
    mem_limit: ${VEDA_MAIL_CLAMAV_MEMORY_LIMIT:-3072m}
    pids_limit: ${VEDA_MAIL_CLAMAV_PIDS_LIMIT:-128}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 60s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    volumes:
      - ./config/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav-signatures:/var/lib/clamav

volumes:
  clamav-signatures:
  veda-mail-data:
