name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Check, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VEDA_MAIL_SETUP_TOKEN: ci-only-token-not-used-in-production
      VEDA_MAIL_DATA_DIR: /tmp/veda-mail-data

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run check

      - name: Enforce coverage baseline
        run: npm run test:coverage

      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium

      - name: Run browser regressions
        run: npm run test:e2e

      - name: Build production application
        run: npm run build

      - name: Audit complete dependency tree
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          build-mode: none
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze source
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3

  security:
    name: Source and container security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan source for secrets and misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: "1"
          hide-progress: true
          scan-ref: .
          scan-type: fs
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          version: v0.72.0

      - name: Build image to scan
        run: docker build --pull --tag veda-mail:security .

      - name: Scan final image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: "1"
          hide-progress: true
          ignore-unfixed: "false"
          image-ref: veda-mail:security
          scan-type: image
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          skip-setup-trivy: "true"
          vuln-type: os,library

  container:
    name: Publish multi-platform container
    if: github.event_name != 'pull_request'
    needs: [quality, codeql, security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}
      REGISTRY: ghcr.io

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=veda-mail
          cache-to: type=gha,mode=max,scope=veda-mail
          provenance: mode=max
          sbom: true

      - name: Install pinned Trivy scanner
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          cache: true
          version: v0.72.0

      - name: Scan published image variants
        env:
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
          PUBLISHED_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PUBLISHED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected published image digest: $PUBLISHED_DIGEST" >&2
            exit 1
          fi

          for platform in linux/amd64 linux/arm64; do
            trivy image \
              --exit-code 1 \
              --ignore-unfixed=false \
              --image-src remote \
              --no-progress \
              --pkg-types os,library \
              --platform "$platform" \
              --scanners vuln,secret \
              --severity HIGH,CRITICAL \
              "$PUBLISHED_IMAGE@$PUBLISHED_DIGEST"
          done

      - name: Promote scanned image to release tags
        env:
          FINAL_TAGS: ${{ steps.meta.outputs.tags }}
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
          PUBLISHED_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          promotion_args=()
          while IFS= read -r tag; do
            if [[ -z "$tag" ]]; then
              continue
            fi
            if [[ "$tag" != "$PUBLISHED_IMAGE:"* ]]; then
              echo "Refusing unexpected release tag: $tag" >&2
              exit 1
            fi
            promotion_args+=(--tag "$tag")
          done <<< "$FINAL_TAGS"

          if (( ${#promotion_args[@]} == 0 )); then
            echo "No release tags were generated." >&2
            exit 1
          fi

          metadata_file="$RUNNER_TEMP/promoted-image.json"
          docker buildx imagetools create \
            "${promotion_args[@]}" \
            --metadata-file "$metadata_file" \
            "$PUBLISHED_IMAGE@$PUBLISHED_DIGEST"

          promoted_digest="$(
            jq -er '."containerimage.descriptor".digest' "$metadata_file"
          )"
          if [[ "$promoted_digest" != "$PUBLISHED_DIGEST" ]]; then
            echo "Promotion changed digest: $promoted_digest" >&2
            exit 1
          fi

      - name: Attest published image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
